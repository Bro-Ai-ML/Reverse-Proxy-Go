# All build contexts point at ../go-backend so every service sees the shared
# packages its replace directives point to.
#
# Required env (e.g. via infra/.env):
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, JWT_SECRET_KEY (auth), AUTH_JWT_SECRET (billing)

services:
  gateway:
    build:
      context: ../go-backend
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - UPSTREAMS=payments=http://payment-service:8001,customers=http://customer-service:8002,webhooks=http://webhook-service:8003,usage=http://usage-service:8080
      - HEALTH_INTERVAL=15s
      # Opt-in demo login (leave unset to fail closed):
      # - GATEWAY_DEMO_USERNAME=demo
      # - GATEWAY_DEMO_PASSWORD=demo
    depends_on:
      - payment-service
      - customer-service
      - webhook-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stripe-network

  payment-service:
    build:
      context: ../go-backend
      dockerfile: services/payment-service/Dockerfile
    environment:
      - PORT=8001
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stripe-network

  customer-service:
    build:
      context: ../go-backend
      dockerfile: services/customer-service/Dockerfile
    environment:
      - PORT=8002
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stripe-network

  webhook-service:
    build:
      context: ../go-backend
      dockerfile: services/webhook-service/Dockerfile
    environment:
      - PORT=8003
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stripe-network

  usage-service:
    build:
      context: ../go-backend
      dockerfile: services/usage-service/Dockerfile
    environment:
      - PORT=8080
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stripe-network

  usage-engine:
    build:
      context: ../go-backend
      dockerfile: services/usage-engine/Dockerfile
    environment:
      - PORT=8082
      - REDIS_URL=redis://redis:6379
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
    depends_on:
      - redis
    networks:
      - stripe-network

  redis:
    image: redis:7-alpine
    networks:
      - stripe-network

  auth-service:
    build:
      context: ../go-backend
      dockerfile: services/auth-service/Dockerfile
    environment:
      - PORT=8080
      - DB_HOST=auth-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=auth
      - DB_SSLMODE=disable
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
    depends_on:
      - auth-db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stripe-network

  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    networks:
      - stripe-network

  billing-service:
    build:
      context: ../go-backend
      dockerfile: services/billing-service/Dockerfile
    environment:
      - PORT=8080
      - DB_HOST=billing-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=billing
      - DB_SSLMODE=disable
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
    depends_on:
      - billing-db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stripe-network

  billing-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing
    volumes:
      - billing-data:/var/lib/postgresql/data
    networks:
      - stripe-network

  user-service:
    build:
      context: ../go-backend
      dockerfile: services/user-service/Dockerfile
    environment:
      - PORT=8080
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=userdb
      - DB_SSLMODE=disable
      - JWT_SECRET_KEY=${USER_SERVICE_JWT_SECRET:?set USER_SERVICE_JWT_SECRET}
    depends_on:
      - user-db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stripe-network

  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: userdb
    volumes:
      - user-data:/var/lib/postgresql/data
    networks:
      - stripe-network

volumes:
  auth-data:
  billing-data:
  user-data:

networks:
  stripe-network:
    driver: bridge
